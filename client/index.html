<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ═══════════════════════════════════════════════════ -->
    <!-- 🚀 SEO META TAGS                                  -->
    <!-- ═══════════════════════════════════════════════════ -->

    <!-- 📌 Primary Title & Description -->
    <title>Tibeb Consultancy - Professional Consulting & Training in Ethiopia</title>
    <meta name="description" content="Tibeb Consultancy provides expert consulting, training, project management, and data analytics services in Ethiopia. Your trusted partner for organizational growth." />
    <meta name="keywords" content="consulting, training, project management, data analytics, Ethiopia, organizational development, capacity building" />
    <meta name="robots" content="index, follow" />
    
    <!-- 📌 Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Tibeb Consultancy - Professional Consulting & Training" />
    <meta property="og:description" content="Expert consulting, training, and project management services in Ethiopia. Transform your organization with Tibeb." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tibeb.com" />
    <meta property="og:image" content="https://www.tibeb.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Tibeb Consultancy" />
    <meta property="og:locale" content="en_US" />
    
    <!-- 📌 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tibeb Consultancy - Professional Consulting & Training" />
    <meta name="twitter:description" content="Expert consulting, training, and project management services in Ethiopia." />
    <meta name="twitter:image" content="https://www.tibeb.com/og-image.jpg" />
    
    <!-- 📌 Author & Copyright -->
    <meta name="author" content="Tibeb Consultancy & Training PLC" />
    <meta name="copyright" content="Tibeb Consultancy & Training PLC" />
    
    <!-- 📌 Language & Geo -->
    <meta name="language" content="English" />
    <meta name="geo.region" content="ET" />
    <meta name="geo.country" content="Ethiopia" />
    
    <!-- 📌 Canonical URL -->
    <link rel="canonical" href="https://www.tibeb.com" />
    
    
    <!-- ✅ Primary Favicon (Most important - works everywhere) -->
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    
    <!-- ✅ PNG Favicon (for modern browsers) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    
    <!-- ✅ Apple Touch Icon (iPhone/iPad home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- ═══════════════════════════════════════════════════ -->
    <!-- 📊 Google Analytics (Already in React code)      -->
    <!-- ═══════════════════════════════════════════════════ -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
